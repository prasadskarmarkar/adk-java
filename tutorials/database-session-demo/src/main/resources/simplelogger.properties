# SLF4J Simple Logger Configuration
# Default log level for all loggers
org.slf4j.simpleLogger.defaultLogLevel=info

# Enable DEBUG logging for Interactions API related classes
org.slf4j.simpleLogger.log.com.google.adk.models.InteractionsUtils=debug
org.slf4j.simpleLogger.log.com.google.adk.models.Gemini=debug
org.slf4j.simpleLogger.log.com.google.adk.flows.llmflows.InteractionsRequestProcessor=debug

# Enable TRACE logging for genai client (HTTP-level logging)
org.slf4j.simpleLogger.log.com.google.genai=trace

# Enable HTTP client logging
org.slf4j.simpleLogger.log.okhttp3=debug

# Show the logger name in the log output
org.slf4j.simpleLogger.showLogName=true

# Show the thread name in the log output
org.slf4j.simpleLogger.showThreadName=true

# Show date/time in the log output
org.slf4j.simpleLogger.showDateTime=true

# Date/time format
org.slf4j.simpleLogger.dateTimeFormat=yyyy-MM-dd HH:mm:ss.SSS
